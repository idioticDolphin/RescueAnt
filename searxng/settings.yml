# Read the documentation before extending the defaults:
# https://docs.searxng.org/admin/settings/

use_default_settings: true

server:
  # Placeholder - any string works for local-only use. Regenerate this
  # (e.g. `openssl rand -hex 32`) if you ever expose this instance beyond
  # localhost, since it's used to sign session data.
  secret_key: "CHANGE-ME-GENERATE-YOUR-OWN"
  image_proxy: true

# RescueAnt's ConfigurableJsonSearchProvider needs the JSON output format,
# which SearXNG disables by default.
search:
  formats:
    - html
    - json
